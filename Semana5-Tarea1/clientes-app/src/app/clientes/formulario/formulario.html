<div class="container mt-4">
  <h2 class="mb-4">Nuevo Cliente</h2>

  <form (ngSubmit)="guardar()" class="row g-3">
    <div class="col-md-6">
      <label for="nombre" class="form-label">Nombre</label>
      <input [(ngModel)]="cliente().nombre" name="nombre" id="nombre" class="form-control" placeholder="Nombre" required>
    </div>

    <div class="col-md-6">
      <label for="apellido" class="form-label">Apellido</label>
      <input [(ngModel)]="cliente().apellido" name="apellido" id="apellido" class="form-control" placeholder="Apellido" required>
    </div>

    <div class="col-md-6">
      <label for="cedula" class="form-label">Cédula</label>
      <input [(ngModel)]="cliente().cedula" name="cedula" id="cedula" class="form-control" placeholder="Cédula" required>
    </div>

    <div class="col-md-6">
      <label for="ciudad" class="form-label">Ciudad</label>
      <input [(ngModel)]="cliente().ciudad" name="ciudad" id="ciudad" class="form-control" placeholder="Ciudad">
    </div>

    <div class="col-md-6">
      <label for="telefono" class="form-label">Teléfono</label>
      <input [(ngModel)]="cliente().telefono" name="telefono" id="telefono" class="form-control" placeholder="Teléfono">
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>

  @if (mensaje() !== null) {
    <div class="alert alert-info mt-3">
      {{ mensaje() }}
    </div>
  }
</div>
